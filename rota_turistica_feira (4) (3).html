    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f7f7f7; overflow: hidden; color: #111; }
    #map { width: 100vw; height: 100vh; z-index: 1; }

    .topbar {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
      border: 1px solid rgba(0,0,0,0.1); padding: 14px 24px; border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 14px;
    }
    .topbar h1 { font-size: 1.1rem; letter-spacing: 0.5px; color: #111; white-space: nowrap; font-weight: 600; }
    .controls-group { display: flex; gap: 8px; }
    .route-btn {
      border: 1px solid #111; padding: 10px 16px; border-radius: 8px; cursor: pointer;
      background: #fff; color: #111; font-weight: bold; transition: all 0.2s; font-size: 0.9rem;
    }
    .route-btn:hover { background: #111; color: #fff; }
    .route-btn:disabled { border-color: #ccc; color: #ccc; background: #fafafa; cursor: not-allowed; }

    .info-panel {
      position: absolute; bottom: -600px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 520px; background: white; z-index: 1001;
      border-radius: 20px 20px 0 0; box-shadow: 0 -10px 35px rgba(0,0,0,0.15);
      transition: bottom 0.5s cubic-bezier(0.19,1,0.22,1);
      border: 1px solid rgba(0,0,0,0.1); border-bottom: none;
      max-height: 88vh; overflow-y: auto;
    }
    .info-panel.active { bottom: 0; }
    .drag-handle { position: sticky; top: 0; z-index: 2; background: white; padding: 10px 0 4px; text-align: center; display: flex; align-items: center; justify-content: center; }
    .drag-handle::after { content: ''; display: inline-block; width: 40px; height: 4px; background: #ddd; border-radius: 2px; }
    .close-panel-btn { position: absolute; right: 14px; top: 10px; background: #f0f0f0; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; transition: background 0.2s; z-index: 3; }
    .close-panel-btn:hover { background: #e0e0e0; color: #111; }
    .panel-inner { padding: 4px 20px 32px; }

    .info-title { font-size: 1.2rem; font-weight: 700; color: #111; margin-bottom: 3px; }
    .info-type { display: inline-block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: #888; font-weight: 600; margin-bottom: 10px; }
    .info-description { font-size: 0.9rem; line-height: 1.55; color: #444; margin-bottom: 14px; }

    .tabs { display: flex; gap: 0; margin-bottom: 14px; border-bottom: 2px solid #eee; }
    .tab-btn {
      padding: 8px 16px; font-size: 0.82rem; font-weight: 600; color: #888;
      background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -2px; transition: all 0.2s;
    }
    .tab-btn.active { color: #111; border-bottom-color: #111; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* GALERIA */
    .photo-gallery { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: #ddd transparent; min-height: 60px; }
    .gallery-item { position: relative; flex-shrink: 0; border-radius: 10px; overflow: hidden; border: 1px solid #eee; }
    .gallery-item img { height: 130px; width: auto; min-width: 190px; display: block; object-fit: cover; cursor: pointer; transition: transform 0.2s; }
    .gallery-item img:hover { transform: scale(1.03); }
    .gallery-item video { height: 130px; width: 200px; display: block; object-fit: cover; cursor: pointer; background: #000; }
    .delete-media { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
    .gallery-item:hover .delete-media { opacity: 1; }

    /* SKELETON loader */
    .photo-skeleton { height: 130px; width: 190px; border-radius: 10px; background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; flex-shrink: 0; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .upload-area { border: 2px dashed #ddd; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s; color: #aaa; font-size: 0.88rem; margin-top: 10px; background: #fafafa; }
    .upload-area:hover, .upload-area.dragover { border-color: #111; color: #111; background: #f0f0f0; }
    .upload-area i { font-size: 1.8rem; margin-bottom: 8px; display: block; }
    .upload-area span { display: block; font-size: 0.75rem; color: #bbb; margin-top: 4px; }
    #fileInputFoto, #fileInputVideo { display: none; }

    .empty-gallery { text-align: center; padding: 24px 10px; color: #bbb; font-size: 0.85rem; }
    .empty-gallery i { font-size: 2rem; display: block; margin-bottom: 8px; }

    /* BOTÃO GOOGLE FOTOS */
    .gfotos-btn {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 10px 0 8px; padding: 9px 16px; border-radius: 8px;
      border: 1.5px solid #ddd; background: #fff; color: #333;
      font-size: 0.84rem; font-weight: 600; text-decoration: none;
      transition: all 0.18s; width: 100%; justify-content: center;
    }
    .gfotos-btn:hover { border-color: #4285F4; background: #f0f6ff; color: #1a73e8; }

    /* YOUTUBE LINK CARDS */
    .yt-links-wrap { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 12px; }
    .yt-link-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: #fff; border: 1.5px solid #eee; text-decoration: none; color: #111; font-size: 0.88rem; font-weight: 600; transition: all 0.18s; }
    .yt-link-card:hover { border-color: #cc0000; background: #fff5f5; }
    .yt-link-card .yt-icon { font-size: 1.5rem; color: #cc0000; flex-shrink: 0; }
    .yt-link-card .yt-arrow { font-size: 0.75rem; color: #aaa; margin-left: auto; flex-shrink: 0; }

    /* LINKS */
    .links-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .link-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; text-decoration: none; transition: all 0.2s; border: 1.5px solid; }
    .link-btn.maps   { color: #1a73e8; border-color: #1a73e8; }
    .link-btn.maps:hover { background: #1a73e8; color: #fff; }
    .link-btn.wiki   { color: #555; border-color: #999; }
    .link-btn.wiki:hover { background: #555; color: #fff; }

    /* LIGHTBOX */
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.93); z-index: 9999; align-items: center; justify-content: center; flex-direction: column; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 92vw; max-height: 85vh; border-radius: 10px; }
    .lightbox-close { position: fixed; top: 16px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; background: none; border: none; line-height: 1; z-index: 10000; }

    /* LEGENDA */
    .legend { position: absolute; bottom: 20px; left: 20px; z-index: 999; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; padding: 16px; width: 240px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
    @media(max-width: 768px) { .legend { display: none; } }
    .legend h3 { margin-bottom: 12px; color: #111; font-size: 0.95rem; font-weight: 600; }
    .legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 0.85rem; color: #444; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }
    .historic { background: #999; } .beach { background: #ddd; } .fort { background: #222; }
    .tram-icon { font-size: 28px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3)); will-change: transform; }

    /* RÓTULO PERMANENTE DOS PONTOS */
    .stop-label {
      background: rgba(255,255,255,0.92); backdrop-filter: blur(4px);
      border: 1px solid rgba(0,0,0,0.15); border-radius: 6px;
      padding: 2px 7px; font-size: 0.72rem; font-weight: 600; color: #111;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12); white-space: nowrap;
    }
    .stop-label::before { display: none; }


    @media(max-width: 768px) {
      .topbar { flex-direction: column; width: 92%; top: 10px; gap: 10px; padding: 12px; }
      .controls-group { width: 100%; justify-content: center; }
      .route-btn { flex: 1; text-align: center; padding: 8px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <h1>📍 Rota de Fortaleza</h1>
  <div class="controls-group">
    <button class="route-btn" id="prevBtn">◀ Voltar</button>
    <button class="route-btn" id="nextBtn">Avançar ▶</button>
  </div>
</div>

<div id="map"></div>

<div class="info-panel" id="infoPanel">
  <div class="drag-handle">
    <button class="close-panel-btn" id="closePanelBtn" title="Fechar">✕</button>
  </div>
  <div class="panel-inner">
    <div class="info-title" id="infoTitle"></div>
    <div class="info-type"  id="infoType"></div>
    <p class="info-description" id="infoDescription"></p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="fotos">🖼️ Fotos</button>
      <button class="tab-btn"        data-tab="videos">▶️ Vídeos</button>
      <button class="tab-btn"        data-tab="links">🔗 Links</button>
    </div>

    <div class="tab-content active" id="tab-fotos">
      <div class="photo-gallery" id="photoGallery"></div>
      <div class="upload-area" id="uploadAreaFoto">
        📷
        Toque para adicionar suas fotos
        <span>JPG, PNG, HEIC — da sua galeria</span>
      </div>
      <input type="file" id="fileInputFoto" accept="image/*" multiple />
    </div>

    <div class="tab-content" id="tab-videos">
      <div id="videoGallery"></div>
      <div class="upload-area" id="uploadAreaVideo">
        🎥
        Adicionar seu próprio vídeo
        <span>MP4, MOV, MKV — da sua galeria</span>
      </div>
      <input type="file" id="fileInputVideo" accept="video/*" multiple />
    </div>

    <div class="tab-content" id="tab-links">
      <div class="links-row" id="linksRow"></div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="" style="display:none" />
  <video id="lightboxVideo" controls style="display:none"></video>
</div>

<div class="legend">
  <h3>Pontos Turísticos</h3>
  <div class="legend-item"><div class="legend-dot fort"></div> Fortes históricos</div>
  <div class="legend-item"><div class="legend-dot historic"></div> Centro histórico</div>
  <div class="legend-item"><div class="legend-dot beach"></div> Orla e praias</div>
  <div class="legend-item"><span style="font-size:1.1rem">🚋</span> Clique em qualquer ponto</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  /* ── INDEXEDDB ── */
  let db;
  const DB_NAME = 'rotaFortaleza', DB_VER = 1, STORE = 'medias';
  function openDB() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
      req.onsuccess = e => { db = e.target.result; res(db); };
      req.onerror   = e => rej(e);
    });
  }
  function dbSave(record) {
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).add(record);
      req.onsuccess = () => res(req.result);
      req.onerror   = () => rej(req.error);
    });
  }
  function dbGetByLocation(locationName) {
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readonly');
      const all = []; const req = tx.objectStore(STORE).openCursor();
      req.onsuccess = e => {
        const cursor = e.target.result;
        if (cursor) { if (cursor.value.location === locationName) all.push(cursor.value); cursor.continue(); }
        else res(all);
      };
      req.onerror = () => rej(req.error);
    });
  }
  function dbDelete(id) {
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      const req = tx.objectStore(STORE).delete(id);
      req.onsuccess = () => res();
      req.onerror   = () => rej(req.error);
    });
  }

  });

      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  /* ── LIGHTBOX ── */
  const lightbox      = document.getElementById('lightbox');
  const lightboxImg   = document.getElementById('lightboxImg');
  const lightboxVideo = document.getElementById('lightboxVideo');
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', e => { if(e.target===lightbox) closeLightbox(); });
  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxVideo.pause(); lightboxVideo.src='';
    lightboxImg.style.display='none'; lightboxVideo.style.display='none';
  }
  function openLightboxImg(src) {
    lightboxImg.src=src; lightboxImg.style.display='block';
    lightboxVideo.style.display='none'; lightbox.classList.add('open');
  }

  /* ── UPLOAD FILES ── */
  document.getElementById('uploadAreaFoto').addEventListener('click', () => document.getElementById('fileInputFoto').click());
  document.getElementById('uploadAreaVideo').addEventListener('click', () => document.getElementById('fileInputVideo').click());

  ['uploadAreaFoto','uploadAreaVideo'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', () => el.classList.remove('dragover'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files);
      const kind = id.includes('Foto') ? 'image' : 'video';
      handleFiles(files.filter(f => f.type.startsWith(kind)), kind);
    });
  });

  document.getElementById('fileInputFoto').addEventListener('change', e => { handleFiles(Array.from(e.target.files), 'image'); e.target.value=''; });
  document.getElementById('fileInputVideo').addEventListener('change', e => { handleFiles(Array.from(e.target.files), 'video'); e.target.value=''; });

  function handleFiles(files, kind) {
    const locName = locations[currentIndex].name;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = async e => {
        const dataUrl = e.target.result;
        const id = await dbSave({ location: locName, kind, dataUrl, name: file.name });
        addMediaItem({ id, kind, dataUrl }, kind === 'image' ? photoGallery : videoGallery);
      };
      reader.readAsDataURL(file);
    });
  }

  function addMediaItem(record, container) {
    const empty = container.querySelector('.empty-gallery');
    if (empty) empty.remove();
    const wrap = document.createElement('div');
    wrap.className = 'gallery-item'; wrap.dataset.id = record.id;
    if (record.kind === 'image') {
      const img = document.createElement('img');
      img.src = record.dataUrl; img.alt = '';
      img.addEventListener('click', () => openLightboxImg(record.dataUrl));
      wrap.appendChild(img);
    } else {
      const vid = document.createElement('video');
      vid.src = record.dataUrl; vid.muted = true; vid.playsInline = true;
      vid.addEventListener('click', () => { lightboxVideo.src=record.dataUrl; lightboxVideo.style.display='block'; lightboxImg.style.display='none'; lightbox.classList.add('open'); lightboxVideo.play(); });
      wrap.appendChild(vid);
    }
    const del = document.createElement('button');
    del.className = 'delete-media'; del.innerHTML = '🗑️'; del.title = 'Remover';
    del.addEventListener('click', async e => { e.stopPropagation(); await dbDelete(record.id); wrap.remove(); });
    wrap.appendChild(del);
    container.appendChild(wrap);
  }

  /* ── BUSCA FOTOS WIKIMEDIA no browser ── */
  async function fetchWikiPhotos(data) {
    // Mostra skeletons enquanto carrega
    photoGallery.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const sk = document.createElement('div');
      sk.className = 'photo-skeleton';
      photoGallery.appendChild(sk);
    }

    // Tenta carregar cada foto; remove skeleton conforme carrega
    const skeletons = Array.from(photoGallery.querySelectorAll('.photo-skeleton'));
    let loaded = 0;

    const tryLoad = (src, skIdx) => {
      const wrap = document.createElement('div'); wrap.className = 'gallery-item';
      const img  = document.createElement('img');
      img.alt = data.name;
      img.style.opacity = '0'; img.style.transition = 'opacity 0.3s';
      img.addEventListener('load', () => {
        img.style.opacity = '1';
        if (skeletons[skIdx]) skeletons[skIdx].replaceWith(wrap);
        loaded++;
      });
      img.addEventListener('error', () => {
        // foto falhou: tenta via proxy Wikimedia
        const encoded = encodeURIComponent(src);
        img.src = src; // já está falhando, deixa skeleton ir
        if (skeletons[skIdx]) skeletons[skIdx].remove();
      });
      img.addEventListener('click', () => openLightboxImg(img.src));
      img.src = src;
      wrap.appendChild(img);
    };

    (data.photos || []).forEach((src, i) => tryLoad(src, i));

    // Remove skeletons restantes após 6s
    setTimeout(() => {
      document.querySelectorAll('.photo-skeleton').forEach(sk => sk.remove());
      if (photoGallery.children.length === 0) {
        photoGallery.innerHTML = '<div class="empty-gallery">📷Sem fotos disponíveis</div>';
      }
    }, 6000);
  }

  /* ── RENDER PAINEL ── */
  async function renderPanel(data) {
    infoTitle.textContent = '🚋 ' + data.name;
    infoType.textContent  = data.type;
    infoDescription.textContent = data.desc;

    // Botão Google Imagens
    const gfotosExistente = document.getElementById('gfotos-btn');
    if (gfotosExistente) gfotosExistente.remove();
    if (data.gfotos) {
      const gBtn = document.createElement('a');
      gBtn.id = 'gfotos-btn';
      gBtn.href = data.gfotos;
      gBtn.target = '_blank';
      gBtn.rel = 'noopener';
      gBtn.className = 'gfotos-btn';
      gBtn.innerHTML = '<svg viewBox="0 0 48 48" width="18" height="18" style="flex-shrink:0"><path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.5 33.5 30 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l6.3-6.3C34.7 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.5 0 20-7.6 20-21 0-1.4-.2-2.7-.5-4z"/><path fill="#34A853" d="M6.3 14.7l7 5.1C15 16.1 19.2 13 24 13c3 0 5.7 1.1 7.8 2.9l6.3-6.3C34.7 5.1 29.6 3 24 3c-7.6 0-14.2 4.6-17.7 11.7z"/><path fill="#FBBC05" d="M24 45c5.5 0 10.5-1.9 14.3-5l-6.6-5.5C29.8 36 27 37 24 37c-6 0-11-3.9-12.8-9.4l-7 5.4C7.8 40.4 15.2 45 24 45z"/><path fill="#EA4335" d="M44.5 20H24v8.5h11.8C34.8 32 30 35 24 36c-3.1 0-5.9-1-8.1-2.5l-7 5.4C12 42.2 17.6 45 24 45c10.5 0 20-7.6 20-21 0-1.4-.2-2.7-.5-4z"/></svg> Ver mais fotos no Google';
      document.getElementById('tab-fotos').insertBefore(gBtn, document.getElementById('uploadAreaFoto'));
    }

    // Fotos com lazy load
    await fetchWikiPhotos(data);

    // Uploads do usuário
    const saved = await dbGetByLocation(data.name);
    saved.filter(r => r.kind === 'image').forEach(r => addMediaItem(r, photoGallery));
    saved.filter(r => r.kind === 'video').forEach(r => addMediaItem(r, videoGallery));

    // Aba vídeos – links do YouTube
    videoGallery.innerHTML = '';
    if (data.ytLinks && data.ytLinks.length) {
      const wrap = document.createElement('div'); wrap.className = 'yt-links-wrap';
      data.ytLinks.forEach(yt => {
        const a = document.createElement('a');
        a.href = yt.url; a.target = '_blank'; a.rel = 'noopener'; a.className = 'yt-link-card';
        a.innerHTML = `<span class="yt-icon">▶️</span><span>${yt.label}</span><span class="yt-arrow">↗</span>`;
        wrap.appendChild(a);
      });
      videoGallery.appendChild(wrap);
    }

    // Links
    linksRow.innerHTML = '';
    if (data.maps) linksRow.innerHTML += `<a class="link-btn maps" href="${data.maps}" target="_blank" rel="noopener">🗺️ Google Maps</a>`;
    if (data.wiki) linksRow.innerHTML += `<a class="link-btn wiki" href="${data.wiki}" target="_blank" rel="noopener">ℹ️ ${data.wiki.includes('wikipedia')?'Wikipedia':'Saiba mais'}</a>`;
  }

  document.getElementById('closePanelBtn').addEventListener('click', () => {
    infoPanel.classList.remove('active');
  });

  /* ── NAVEGAÇÃO ── */
  function smoothAnimateMarker(marker, startLoc, endLoc, duration, callback) {
    const startTime = performance.now();
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    function update(t) {
      const p = Math.min((t - startTime) / duration, 1);
      const e = 1 - Math.pow(1 - p, 3);
      marker.setLatLng([startLoc[0]+(endLoc[0]-startLoc[0])*e, startLoc[1]+(endLoc[1]-startLoc[1])*e]);
      if (p < 1) animationFrameId = requestAnimationFrame(update);
      else if (callback) callback();
    }
    animationFrameId = requestAnimationFrame(update);
  }

  function navigateToIndex(index) {
    if (index < 0 || index >= routeCoords.length || index === currentIndex) return;
    const startCoords = routeCoords[currentIndex];
    currentIndex = index;
    const targetData = locations[currentIndex];
    infoPanel.classList.remove('active');
    map.flyTo(targetData.coords, 14, { animate: true, duration: 1.5 });
    smoothAnimateMarker(tramMarker, startCoords, targetData.coords, 1400, async () => {
      await renderPanel(targetData);
      infoPanel.classList.add('active');
    });
    atualizarBotoes();
  }

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  function atualizarBotoes() {
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === routeCoords.length - 1;
  }
  prevBtn.addEventListener('click', () => { if(currentIndex>0) navigateToIndex(currentIndex-1); });
  nextBtn.addEventListener('click', () => { if(currentIndex<routeCoords.length-1) navigateToIndex(currentIndex+1); });

  /* ── INICIAR ── */
  openDB().then(() => {
    window.addEventListener('load', () => {
      setTimeout(() => { currentIndex = 1; navigateToIndex(0); }, 800);
    });
  });
</script>
